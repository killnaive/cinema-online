[package]
name = "cinema-online"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Standalone Cinema online streaming module (plugin crate & manifest protocol)"

[dependencies]
base64 = "0.22"
futures = "0.3"
parking_lot = "0.12"
regex = "1"
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls", "gzip", "stream", "query"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["time"] }
url = "2"
